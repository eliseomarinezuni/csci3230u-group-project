<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Recommendedstyles.css">
    <link rel="stylesheet" href="Favourites.css">
    <title>Notflix — Favourites</title>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo" aria-label="Notflix Home">NOTFLIX</a>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="Recommended.html" class="nav-link">Recommended</a></li>
                    <li><a href="Watched.html" class="nav-link">Watched</a></li>
                    <li><a href="Genre.html" class="nav-link">Genre</a></li>
                    <li><a href="Favourites.html" class="nav-link active" aria-current="page">Favourites</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-section">
            <h1>Favourited Movies</h1>
            <div id="favourited-movies" class="movie-grid">
                <article class="movie-card" data-movie-id="1">
                    <div class="movie-card__image-wrapper">
                        <img class="movie-card__image" src="images/Inception.jpeg" alt="Poster for Inception" style="display: block;">
                        <div class="movie-card__placeholder" aria-hidden="true" style="display: none;">Inception</div>
                    </div>

                    <div class="movie-card__body">
                        <h2 class="movie-card__title">Inception</h2>
                        <div class="movie-card__meta">
                            <span class="movie-card__rating" aria-label="Rating 8.8 out of 10">★ 8.8</span>
                            <span>Sci-Fi / Thriller</span>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Notflix</p>
    </footer>

</body>
</html>
